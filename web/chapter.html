<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chapter · Tirukkuṟaḷ · Thamizh.ai</title>
<meta name="description" content="A chapter of the Tirukkuṟaḷ: ten couplets with translations and recitation.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Thamizh.ai">
<meta property="og:title" content="Chapter · Tirukkuṟaḷ · Thamizh.ai">
<meta property="og:description" content="A chapter of the Tirukkuṟaḷ: ten couplets with translations and recitation.">
<meta property="og:url" content="https://thamizh.ai/chapter">
<meta property="og:image" content="https://thamizh.ai/assets/og.png">
<meta property="og:image:width" content="1200">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
<div data-site-header data-crumbs="<a href='/library'>Library</a> › Tirukkuṟaḷ › <strong id='crumb'>Chapter</strong>"></div>
<main class="wrap" style="padding-top:40px">
  <div class="pager">
    <div>
      <p class="eyebrow" id="kicker">Chapter</p>
      <h1 id="title" lang="ta" style="font-family:var(--ta);font-size:clamp(30px,4vw,42px);margin-top:6px"></h1>
      <p id="sub" class="muted" style="margin-top:6px;font-size:17px"></p>
    </div>
    <div style="display:flex;gap:8px">
      <a class="iconbtn" id="prev" aria-label="Previous chapter" href="#"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></a>
      <a class="iconbtn" id="next" aria-label="Next chapter" href="#"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></a>
    </div>
  </div>
  <div id="playall" style="margin:8px 0 20px"></div>
  <div class="couplets" id="list"><p class="pending">Loading…</p></div>
</main>
<div data-site-footer></div>
<script src="/assets/site.js"></script>
<script src="/assets/listen.js"></script>
<script>
(async function () {
  const c = Math.min(133, Math.max(1, parseInt(new URLSearchParams(location.search).get('c'), 10) || 1));
  const [idx, data] = await Promise.all([Th.json('/data/kural/index.json'), Th.json('/data/kural/' + c + '.json')]);
  let ch, book;
  idx.books.forEach((b) => b.chapters.forEach((x) => { if (x.n === c) { ch = x; book = b; } }));
  document.title = ch.tr + ' · Tirukkuṟaḷ · Thamizh.ai';
  Th.meta('Tirukkuṟaḷ chapter ' + ch.n + ', ' + ch.ta + ' (' + ch.tr + '): ten couplets with translations and recitation.');
  document.getElementById('crumb').textContent = 'Chapter ' + c;
  document.getElementById('kicker').textContent = 'Chapter ' + c + ' · ' + book.tr;
  document.getElementById('title').textContent = ch.ta;
  document.getElementById('sub').textContent = ch.tr + ' · couplets ' + ch.first + '–' + ch.last;
  const prev = document.getElementById('prev'), next = document.getElementById('next');
  if (c > 1) prev.href = '/chapter?c=' + (c - 1); else prev.setAttribute('aria-disabled', 'true');
  if (c < 133) next.href = '/chapter?c=' + (c + 1); else next.setAttribute('aria-disabled', 'true');
  document.getElementById('list').innerHTML = data.kurals.map((k) =>
    '<a href="/kural?n=' + k.n + '" data-n="' + k.n + '"><span class="num">' + k.n + '</span><span><span class="ta" lang="ta">' +
    ThListen.wrap(k.lines) + '</span><div class="tr">' + k.tr.map(Th.esc).join(' / ') + '</div>' +
    (k.ai && k.ai.translation ? '<div style="margin-top:6px">' + Th.esc(k.ai.translation) + '</div>' : '') +
    '</span></a>'
  ).join('');
  ThListen.playAll(document.getElementById('playall'), data.kurals.map((k) => k.n), (n) => {
    document.querySelectorAll('#list a').forEach((a) => {
      const on = a.dataset.n === String(n);
      a.style.background = on ? 'var(--tint)' : '';
      if (on) { a.setAttribute('aria-current', 'true'); a.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } else a.removeAttribute('aria-current');
    });
  }, (n, t) => {
    const byN = {}; data.kurals.forEach((k) => { byN[k.n] = k; });
    document.querySelectorAll('#list a').forEach((a) => {
      const k = byN[a.dataset.n];
      ThListen.paint(a, k && k.timing, a.dataset.n === String(n) ? t : null);
    });
  });
})();
</script>
</body>
</html>
